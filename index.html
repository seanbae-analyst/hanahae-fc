<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>하나해 FC 회비 장부</title>
<meta name="description" id="ogDesc0" content="Club finance dashboard: auto-reconciled bank ledger, dues tracking and weekly cash-flow forecast.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HANA HAE FC">
<meta property="og:title" content="하나해 FC 회비 장부">
<meta property="og:description" content="회비 납부 현황, 지출 내역, 주간 현금흐름 예측을 한눈에 보는 하나해 FC 장부">
<meta property="og:image" content="https://seanbae-analyst.github.io/hanahae-fc/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:url" content="https://seanbae-analyst.github.io/hanahae-fc/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://seanbae-analyst.github.io/hanahae-fc/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a treasurer's ledger under the club crest band — tabs, summary first, detail below. Crest navy and gold carry the brand; clay marks money out. */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --ink:#111833; --muted:#5F6478; --line:#E0DED6;
  --accent:#23407A; --accent-soft:#E3E9F5; --out:#B5532F; --out-soft:#F6E6DE;
  --navy:#070B1E; --gold:#D8B676;
  --warn:#9A6A00; --warn-soft:#FBF1D6; --bad:#B3261E; --bad-soft:#FBE3E1;
  --display:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Sans","IBM Plex Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#090D1F; --surface:#111731; --ink:#ECE8DD; --muted:#9A9FB4; --line:#232B4A;
  --accent:#D8B676; --accent-soft:#2A2617; --out:#E58A63; --out-soft:#3A2419;
  --warn:#E2B54A; --warn-soft:#382D12; --bad:#F08A80; --bad-soft:#3D1D1A; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#090D1F; --surface:#111731; --ink:#ECE8DD; --muted:#9A9FB4; --line:#232B4A;
  --accent:#D8B676; --accent-soft:#2A2617; --out:#E58A63; --out-soft:#3A2419;
  --warn:#E2B54A; --warn-soft:#382D12; --bad:#F08A80; --bad-soft:#3D1D1A; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6;letter-spacing:-0.01em;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
p,.note,.sub,.banner,.memo{text-wrap:pretty}
.wrap{max-width:1120px;margin:0 auto;padding:20px 20px 60px}
.crest{background:var(--navy);color:var(--gold);border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.crest .id{display:flex;align-items:center;gap:14px}
.crest img{width:52px;height:52px;border-radius:10px;display:block}
.crest h1 .club{display:block;font-family:var(--body);font-size:11px;letter-spacing:.14em;color:#B9B4A4;margin:0 0 1px;font-weight:600}
.crest{position:sticky;top:0;z-index:15;box-shadow:0 6px 18px rgba(7,11,30,.18)}
.crest h1{color:var(--gold)} .crest h1 #asof{color:#B9B4A4}
.crest .btn{background:transparent;color:var(--gold);border-color:#5A4D2E}
.crest .btn.primary{background:var(--gold);border-color:var(--gold);color:var(--navy)}
h1{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:-0.02em;margin:0;line-height:1.2;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:0;margin-top:4px}
h2{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-0.01em;margin:0 0 10px;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
#tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
#tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
#tabs a:focus-visible,.tabbar a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1000px){.kpis6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(17,24,51,.04),0 4px 14px rgba(17,24,51,.04)}
.kpi .label{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.kpi .value{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.in{background:var(--accent-soft);color:var(--accent)}
.chip.out{background:var(--out-soft);color:var(--out)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.ok{color:var(--accent)} .neg{color:var(--out)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
td.r,th.r{text-align:right}
td.num,th.r,td:first-child,th{white-space:nowrap}
.scroll{overflow-x:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] button.primary{color:#0A0E22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0A0E22}}
button:disabled{opacity:.5;cursor:not-allowed}
button.danger{color:var(--bad)}
button.small{padding:3px 8px;font-size:12px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
select.cat{padding:3px 6px;font-size:13px}
input[type="number"]{width:120px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.note{font-size:12px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.bad{background:var(--bad-soft);color:var(--ink)}
.dues td,.dues th{text-align:center;padding:6px 4px}
.dues td:first-child,.dues th:first-child{text-align:left;padding-left:8px;position:sticky;left:0;background:var(--surface)}
.cell{display:inline-block;min-width:46px;padding:2px 4px;border-radius:6px;font-size:12px;font-weight:600}
.cell.paid{background:var(--accent-soft);color:var(--accent)}
.cell.part{background:var(--warn-soft);color:var(--warn)}
.cell.miss{background:var(--bad-soft);color:var(--bad)}
.cell.na{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar .track{height:10px;min-width:40px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--out);border-radius:5px}
.chartbox{position:relative;height:260px}
.hidden{display:none!important}
.tag{font-size:11px;color:var(--muted);margin-left:4px}
.memo{color:var(--muted);font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.drop{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:760px){.drop{grid-template-columns:1fr}}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer;background:var(--bg);transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dropzone b{font-family:var(--display);font-size:16px}
.steps{margin:0;padding-left:18px;font-size:13px;color:var(--muted)} .steps li{margin:2px 0}
.memlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 18px}
.memrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);min-width:0}
.memsub{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)} .memsub:empty{display:none}
.memsince{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)} .memsince input{min-height:32px;padding:2px 6px;font-size:13px;width:128px}
.memsub select{min-height:32px;font-size:13px;width:auto} .chipbtn{border:0;cursor:pointer;font:inherit;font-size:12px}
.memname{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memact{display:flex;gap:6px;flex-shrink:0} .memact button{min-height:34px;padding:4px 10px}
.cadence{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.dash{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.dash .span2,.dash .hero{grid-column:1/-1}
.hero{background:linear-gradient(155deg,#121B45 0%,#070B1E 70%);color:#ECE8DD;border:0;padding:22px}
.hero .label{color:#B9B4A4!important}
.hero .big{color:var(--gold)}
.hero .chip.in{background:rgba(216,182,118,.16);color:var(--gold)}
.hero .chip.out{background:rgba(229,138,99,.18);color:#F0A585}
.hero .chip.bad{background:rgba(240,138,128,.18);color:#F5A9A1}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.quick button,.quick a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.07);color:#ECE8DD;font-size:12.5px;font-weight:600;border:0;text-decoration:none;cursor:pointer}
.quick svg{color:var(--gold)}
.hero .label{color:var(--muted);font-size:13px;font-weight:600}
.hero .big{font-family:var(--mono);font-weight:700;font-size:40px;letter-spacing:-0.03em;line-height:1.15;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.rowhead h2{margin:0}
.strong{font-weight:700;font-size:18px} .muted{color:var(--muted)} .small{font-size:13px}
.progress{height:12px;border-radius:6px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.progress div{height:100%;background:var(--accent);border-radius:6px}
.notice{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;text-decoration:none;color:var(--ink);background:var(--warn-soft);border-color:transparent}
.chip.out{background:var(--out-soft);color:var(--out)}
#tabs{position:sticky;top:0;z-index:5;background:var(--bg)}
@media (max-width:640px){
  .wrap{padding:10px 12px 48px}
  .crest{margin:-10px -12px 10px;border-radius:0 0 20px 20px;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;gap:10px}
  .crest{flex-wrap:nowrap} .crest .id{min-width:0} .adminbtn{flex-shrink:0}
  .crest img{width:40px;height:40px;border-radius:9px}
  .crest h1{font-size:21px} .crest h1 #asof{font-size:11.5px}
  .crest .toolbar{display:none}
  .card{padding:16px;border-radius:18px}
  .hero{padding:22px 18px}
  .wrap{min-height:100vh}
  .dash{grid-template-columns:1fr;gap:12px}
  .hero .big{font-size:34px}
  .kpis{grid-template-columns:1fr}
  .bar{grid-template-columns:64px 1fr auto}
  .hide-sm{display:none}
  th,td{padding:7px 6px}
  .form{display:grid;grid-template-columns:1fr 1fr} .form button{grid-column:1/-1}
  .form input,.form select{width:100%}
  input[type="number"]{width:100%}
  table.list thead{display:none}
  table.list tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  table.list td{border:0;padding:0}
  table.list .c-date{grid-column:1/-1;font-size:12px;color:var(--muted)}
  table.list .c-amt{font-weight:700;font-size:15px;text-align:right}
  table.list .c-cat,table.list .c-month,table.list .c-del{grid-column:1/-1}
  table.list .c-month:empty,table.list .c-del:empty,table.list .c-bal{display:none}
  .dues td,.dues th{padding:5px 3px} .cell{min-width:38px}
}
.tabbar{display:none}
.pager{display:none}
@keyframes inR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
#view.inR{animation:inR .22s ease-out} #view.inL{animation:inL .22s ease-out}
@media (max-width:640px){
  #tabs{display:none}
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navy);padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #1E2547}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:#8E93A8;text-decoration:none;font-size:11px;font-weight:600;border-radius:10px}
  .tabbar a[aria-current="page"]{color:var(--gold)}
  .pager{display:flex;justify-content:center;gap:6px;margin:2px 0 12px}
  .pager i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s}
  .pager i.on{width:18px;background:var(--accent)}
}
.adminbtn{order:3;margin-left:auto;font:inherit;font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 12px;border:1px solid #5A4D2E;background:transparent;color:var(--gold);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.langbtn{order:4;margin-left:0;padding:6px 10px;min-width:40px;justify-content:center}
.adminbtn.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
dialog{border:0;border-radius:18px;padding:0;max-width:min(92vw,380px);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(7,11,30,.55)}
.pinform{display:grid;gap:12px;padding:22px}
.pinform input{width:100%}
.gate{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px 0}
.gate .card{max-width:380px;width:100%;text-align:center;display:grid;gap:12px;justify-items:center;padding:28px 22px}
.gate img{width:96px;height:96px;border-radius:16px}
.gate form{display:grid;gap:10px;width:100%}
.gate input{width:100%;text-align:center;font-size:16px;padding:10px}
body.locked #tabs,body.locked .tabbar,body.locked .pager,body.locked .crest .toolbar{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="crest">

function dt(t){return new Date(t.t)}
function hash(s){let h=5381;for(const ch of s)h=((h*33)^ch.codePointAt(0))>>>0;return h.toString(36)}
function txId(iso,name,amt,bal){return "t"+iso.replace(/\D/g,"").slice(0,14)+"_"+hash(name+"|"+amt+"|"+(bal??""))}
function baseName(n){return String(n||"").replace(/\(.*$/,"").trim()}

function classify(t,c){
  if(t.cat) return {cat:t.cat,auto:false};
  if(t.type==="이자입금") return {cat:"이자",auto:true};
  const memo=(t.memo||"").trim(); const text=memo+" "+(t.name||"");
  for(const [cat,words] of MEMO_WORDS) if(words.some(w=>text.includes(w))) return {cat,auto:true};
  if(t.amt===c.dues) return {cat:"회비",auto:true};
  if(memo) return {cat:t.amt>0?"기타수입":"기타지출",auto:true};
  return {cat:t.amt>0?"기타수입":"미분류",auto:true,check:true};
}
function dueMonth(t){ if(t.month) return t.month; const d=dt(t); const k=ym(d); return d.getDate()>=25?addM(k,1):k; }
function payer(t){return t.payer||baseName(t.name)}

function rows(){
  const c=cfg();
  return [...state.tx.values()].map(t=>{const k=classify(t,c);return Object.assign({},t,{_cat:k.cat,_auto:k.auto,_check:!!k.check,_rule:k.rule,_guess:k.guess||null,_m:ym(dt(t))})})
    .sort((a,b)=>a.t<b.t?1:a.t>b.t?-1:0);
}
function months(rs){ const c=cfg(); const cur=ym(today()); const out=[]; let k=c.startMonth;
  const first=rs.length?rs[rs.length-1]._m:cur; if(first<k)k=first;
  while(k<=cur){out.push(k);k=addM(k,1)} return out; }
function monthAgg(rs){ const c=cfg(); const a={}; const add=(m,k,v)=>{(a[m]??={}); a[m][k]=(a[m][k]||0)+v};
  for(const r of rs){ if(r._cat==="회비"&&r.amt>c.dues){ const extra=r.amt%c.dues; add(r._m,"회비",r.amt-extra); if(extra) add(r._m,"연체료/벌금",extra); } else add(r._m,r._cat,r.amt); } return a; }
function opexOf(m){return Object.entries(m||{}).reduce((s,[k,v])=>OPEX.has(k)?s+v:s,0)}
function req(name,m){const c=cfg();return c.adjust&&c.adjust[name+"|"+m]?c.adjustAmt:c.dues}
function duesMatrix(rs){ const c=cfg(); const map={}; const unknown=[];
  const names=new Set(c.members.map(m=>m.name));
  for(const r of [...rs].reverse()){ if(r._cat!=="회비")continue; const p=payer(r); const m=dueMonth(r);
    if(!names.has(p)){unknown.push(r);continue}
    (map[p]??={});
    const add=(k,v)=>{const e=(map[p][k]??={amt:0,last:null}); e.amt+=v; e.last=r.t;};
    const n=Math.floor(r.amt/c.dues); // 4만원이면 두 달치, 2.5만원이면 한 달치 + 연체료
    if(n>=1){ for(let i=0;i<n;i++) add(addM(m,i),c.dues); } else add(m,r.amt); }
  return {map,unknown};
}
const paidAmt=(mx,n,m)=>mx.map[n]?.[m]?.amt||0;
function lateInfo(rs){ // 회칙 제4조: 매월 dueDay일까지, 연체 1주당 lateFee
  const c=cfg(); const mx=duesMatrix(rs); const now=today(); const list=[];
  for(const mem of c.members){ if(mem.active===false) continue;
    for(const m of months(rs)){ if(m<c.lateFrom||m<(mem.since||c.startMonth)) continue;
      const e=mx.map[mem.name]?.[m]; const need=req(mem.name,m);
      const deadline=new Date(`${m}-${String(c.dueDay).padStart(2,"0")}T23:59:59`);
      const paid=e&&e.amt>=need; const end=paid?new Date(e.last):now;
      if(end<=deadline) continue;
      const weeks=Math.ceil((end-deadline)/(7*864e5));
      list.push({name:mem.name,m,paid,paidAt:paid?e.last:null,weeks,fee:weeks*c.lateFee}); } }
  const paidFees={};
  for(const r of rs){ const p=payer(r);
    if(r._cat==="회비"&&r.amt%c.dues&&r.amt>c.dues) paidFees[p]=(paidFees[p]||0)+r.amt%c.dues;
    if(r._cat==="연체료/벌금") paidFees[p]=(paidFees[p]||0)+r.amt; }
  return {list,paidFees};
}
function streak(mx,name,rs){ const c=cfg(); const since=(c.members.find(x=>x.name===name)||{}).since||c.startMonth; const cur=ym(today()); const ms=months(rs).filter(m=>m>=since&&(m<cur||today().getDate()>c.dueDay)); let n=0;
  for(let i=ms.length-1;i>=0;i--){ if(paidAmt(mx,name,ms[i])>=req(name,ms[i])) break; n++; } return n; }
function paidCount(mx,m){const c=cfg();return c.members.filter(x=>x.active!==false&&paidAmt(mx,x.name,m)>=req(x.name,m)).length}

/* ---------- writes ---------- */
const I18N_MISS=new Set();
const TR_RX=/(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) '\d{2}|−?₩[\d,]+|(\d{2})년 (\d{1,2})월|(\d{1,2})월 (\d{1,2})일|(\d{1,2})월|[+−]?\d[\d,.]*/g;
function trText(s){
  if(!EN||!s||!/[가-힣]/.test(s)) return s;
  const lead=s.match(/^\s*/)[0], trail=s.match(/\s*$/)[0], core=s.trim(); const toks=[];
  const key=core.replace(TR_RX,(m,y,mo1,mo2,d,mo3)=>{ if(/^[A-Z][a-z]{2} '/.test(m)){toks.push(m);return "{m}"} if(m.includes("₩")){toks.push(m);return "{a}"} if(y){toks.push(`${MON[mo1-1]} '${y}`);return "{m}"} if(mo2){toks.push(`${MON[mo2-1]} ${d}`);return "{m}"} if(mo3){toks.push(MON[mo3-1]);return "{m}"} toks.push(m);return "{n}"; });
  const en=DICT[key]; if(en==null){ I18N_MISS.add(key); return s; }
  let i=0; return lead+en.replace(/\{[amn]\}/g,()=>toks[i++]??"")+trail;
}
function trTree(root){
  if(!EN||!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentElement.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const ns=[]; while(w.nextNode()) ns.push(w.currentNode); for(const n of ns){ const t=trText(n.nodeValue); if(t!==n.nodeValue) n.nodeValue=t; }
  root.querySelectorAll?.("[placeholder],[aria-label],[title]").forEach(el=>{ for(const a of ["placeholder","aria-label","title"]){ const v=el.getAttribute(a); if(v){ const t=trText(v); if(t!==v) el.setAttribute(a,t);} } });
}
function trChart(ch){ if(!EN||!ch) return ch; ch.data.labels=(ch.data.labels||[]).map(l=>typeof l==="string"?trText(l):l); ch.data.datasets.forEach(d=>d.label=trText(d.label)); ch.update("none"); return ch; }
function say(html,kind="info",ms=6000){ const el=$("#msg"); el.innerHTML=`<div class="banner ${kind}">${html}</div>`; trTree(el); if(ms) setTimeout(()=>{if(el.innerHTML.includes(html))el.innerHTML=""},ms); }
function writeErr(e){ if(e&&e.code==="invalid_argument"&&canWrite!==true){canWrite=false;render();say("이 계정은 보기만 할 수 있어요. 수정하려면 장부 주인에게 편집 권한을 받아야 해요.","warn",0);return}
  if(e&&e.code==="quota_exceeded"){say("저장 공간이 가득 찼어요. 오래된 거래를 정리한 뒤 다시 해주세요.","bad",0);return}
  say("저장하지 못했어요. 잠시 뒤 다시 해주세요. ("+esc(e?.code||e)+")","bad"); }

function toIso(v){
  if(v instanceof Date) return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,19);
  const s=String(v).trim(); const m=s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})[ T]*(\d{1,2})?:?(\d{2})?:?(\d{2})?/);
  if(!m) return null; const p=x=>String(x||0).padStart(2,"0");
  return `${m[1]}-${p(m[2])}-${p(m[3])}T${p(m[4])}:${p(m[5])}:${p(m[6])}`;
}
const toNum=v=>typeof v==="number"?v:Number(String(v??"").replace(/[^\d.\-]/g,""));
async function importFile(file){
  if(!db){say("지금은 장부에 저장할 수 없어서 불러올 수 없어요.","bad");return}
  const buf=await file.arrayBuffer();
  let grid;
  try{ const wb=XLSX.read(buf,{type:"array",cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]]; grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}); }
  catch(e){ say("파일을 읽지 못했어요. 토스에서 받은 엑셀 파일이 맞는지 확인해주세요.","bad"); return; }
  const hi=grid.findIndex(r=>r&&r.some(c=>String(c||"").replace(/\s/g,"")==="거래일시"));
  if(hi<0){say("‘거래 일시’ 열을 찾지 못했어요. 토스 거래내역서 엑셀인지 확인해주세요.","bad");return}
  const H=grid[hi].map(c=>String(c||"").replace(/\s/g,""));
  const col=n=>H.indexOf(n);
  const ci={t:col("거래일시"),name:col("적요"),type:col("거래유형"),amt:col("거래금액"),bal:col("거래후잔액"),memo:col("메모")};
  if(ci.amt<0){say("‘거래 금액’ 열을 찾지 못했어요.","bad");return}
  let added=0,skipped=0,bad=0;
  const todo=[];
  for(const r of grid.slice(hi+1)){
    if(!r||r[ci.t]==null||r[ci.t]==="") continue;
    const iso=toIso(r[ci.t]); const amt=toNum(r[ci.amt]);
    if(!iso||!isFinite(amt)){bad++;continue}
    const name=String(r[ci.name]??"").trim(); const balRaw=ci.bal>=0?r[ci.bal]:null;
    const bal=balRaw==null||balRaw===""?null:toNum(balRaw);
    const id=txId(iso,name,amt,bal);
    if(state.tx.has(id)){skipped++;continue}
    const d={t:iso,name,type:ci.type>=0?String(r[ci.type]??""):"",amt,src:"toss"};
    if(bal!=null&&isFinite(bal)) d.bal=bal;
    const memo=ci.memo>=0?String(r[ci.memo]??"").trim():""; if(memo) d.memo=memo;
    todo.push([id,d]);
  }
  say(`${todo.length}건 저장하는 중…`,"info",0);
  for(const [id,d] of todo){ try{ await db.doc("tx/"+id).set(d); added++; }catch(e){ writeErr(e); break; } }
  if(added||skipped) saveCfg({lastImport:{at:new Date().toISOString(),added,skipped,file:file.name.slice(0,80)}});
  say(`새 거래 <b>${added}건</b>을 추가했어요. 이미 장부에 있던 ${skipped}건은 건너뛰었어요.${bad?` 읽을 수 없는 줄 ${bad}개는 뺐어요.`:""} 확인이 필요한 거래는 거래내역 탭의 ‘확인 필요’에서 볼 수 있어요.`,"info",0);
}

function cadence(rs){ // 매주 월요일(일요일 정기 운동 다음 날) 업로드
  const c=cfg(); const d=today(); d.setHours(0,0,0,0);
  const li=c.lastImport?.at?new Date(c.lastImport.at):null;
  const lastToss=rs.find(r=>r.src==="toss"); const lastTx=lastToss?new Date(lastToss.t):null;
  const ref=li||lastTx; const now=today(); const ago=ref?Math.floor((now-ref)/864e5):null;
  let target=new Date(ref||d); target.setHours(0,0,0,0); target.setDate(target.getDate()+(((8-target.getDay())%7)||7));
  if(target<d) target=d;
  const y=target.getFullYear(),mo=target.getMonth(),day=target.getDate(); const lastDay=new Date(y,mo+1,0).getDate();
  const dueNext=c.dueDay+1; let why="일요일 경기 다음 날이라 구장비·물값 정산을 바로 반영할 수 있어요";
  if(day>=dueNext&&day<dueNext+7) why=`회비 마감(${c.dueDay}일)이 지난 주라 미납·연체도 같이 확인돼요`;
  else if(day>lastDay-7) why="마지막 주라 단톡방에 월말 회계 공개(제11조)하기 전에 올려두면 좋아요";
  const fmt=x=>`${x.getMonth()+1}월 ${x.getDate()}일`;
  const wd=["일","월","화","수","목","금","토"];
  return {target,why,fmt:x=>fmt(x),label:`${fmt(target)}(${wd[target.getDay()]})`,li,lastTx,ago,isToday:target.getTime()===d.getTime(),stale:ago!=null&&ago>8};
}

/* ---------- financial model: 주 단위 현금흐름 ----------
   실제 돈이 움직이는 날짜대로 예상 거래를 만들고, 주(월~일)와 월로 묶어요.
   · 회비: 매달 마감일(10일)이 있는 주에 들어와요. 이번 달은 아직 안 낸 사람 몫만.
   · 구장비: 한 달 N번(기본 3번), 그달 일요일에 고르게 나눠서 1회 금액만큼 나가요. 이번 달은 이미 낸 횟수를 빼요.
   · 물·기타 반복 지출: 경기 날마다 나눠서 나가요.
   · 일회성(장비·대회·회식·경조사): 월평균을 매달 첫 주에 예비로 잡고, 예정 지출이 더 크면 그 금액으로.

function fcInputs(rs){

function fcEvents(rs,I,sc=SCEN.base,over={}){
  const c=cfg(); const dues=over.dues??c.dues; const rate=Math.max(0,Math.min(100,(over.rate??I.rate)+sc.rate)); const payers=Math.round(I.members*rate/100);
  const cur=ym(today()); const H=over.horizon||I.horizon; const mx=duesMatrix(rs);
  const t0=new Date(today()); t0.setHours(23,59,59,0); const tmr=new Date(t0.getTime()+1000);
  const ev=[]; const add=(d,kind,amt,m,note)=>{ if(amt) ev.push({d,kind,amt,m,note}); };
  const planned=m=>c.planned.filter(p=>p.month===m).reduce((s,p)=>s+Number(p.amt||0),0);
  for(let i=0;i<=H;i++){ const m=addM(cur,i); const [y,mo]=m.split("-").map(Number);
    const st=i===0?monthStats(rs,m):null;
    // 회비
    const dueDate=new Date(y,mo-1,c.dueDay); 
    if(i===0){ const rem=Math.max(0,payers-paidCount(mx,m)); add(dueDate>t0?dueDate:tmr,"inc",rem*dues,m,`회비 ${rem}명`); }
    else add(dueDate,"inc",payers*dues,m,`회비 ${payers}명`);
    // 구장비 + 경기날 물·기타
    const suns=sundayList(m,i===0?t0:null);

    const picks=i===0?suns.slice(0,k):Array.from({length:Math.min(k,suns.length)},(_,j)=>suns[Math.min(suns.length-1,Math.round((j+0.5)*suns.length/k-0.5))]);

function projectWeeks(rs,I,sc=SCEN.base,over={}){

  const mon=new Date(start); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const last=ev.length?ev[ev.length-1].d:start; let run=balanceNow(rs); const out=[];
  for(let w=new Date(mon); w<=last; w.setDate(w.getDate()+7)){ const end=new Date(w); end.setDate(end.getDate()+6); end.setHours(23,59,59);
    const e=ev.filter(x=>x.d>=w&&x.d<=end); const inc=e.filter(x=>x.kind==="inc").reduce((s,x)=>s+x.amt,0); const outA=e.filter(x=>x.kind!=="inc").reduce((s,x)=>s+x.amt,0);

function report(rs){
  const c=cfg(); const ms=months(rs); const cur=ym(today());
  if(!state.repMonth||!ms.includes(state.repMonth)) state.repMonth=cur;
  const m=state.repMonth; const agg=monthAgg(rs); const a=agg[m]||{}; const mx=duesMatrix(rs);
  let run=c.startBalance; for(const k of ms){ run+=Object.values(agg[k]||{}).reduce((s,v)=>s+v,0); if(k===m) break; }
  const [y,mo]=m.split("-"); const L=`${Number(mo)}월`;
  const inc=[["회비",a["회비"]],["연체료·벌금",a["연체료/벌금"]],["기타 수입",(a["기타수입"]||0)+(a["이자"]||0)]].filter(([,v])=>v);
  const out=Object.keys(a).filter(k=>OPEX.has(k)).map(k=>[k,-(a[k]||0)]).filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1]);
  const uni=a["유니폼"]||0;
  const tin=inc.reduce((s,[,v])=>s+v,0), tout=out.reduce((s,[,v])=>s+v,0);
  const pc=paidCount(mx,m); const act=c.members.filter(x=>x.active!==false);
  const unpaid=act.filter(x=>paidAmt(mx,x.name,m)<req(x.name,m)&&m>=(x.since||c.startMonth)).map(x=>x.name);
  const adj=act.filter(x=>req(x.name,m)!==c.dues).map(x=>x.name);
  const guesses=rs.filter(r=>r._m===m&&r._guess).length;
  const f=n=>Math.round(n).toLocaleString("ko-KR")+"원";
  const lines=[`[하나해 FC ${L} 회계 보고]`,`(${y}.${mo}.01 ~ ${m===cur?new Date().toLocaleDateString("ko-KR"):y+"."+mo+" 말일"})`,"",
    `■ 수입 ${f(tin)}`,...inc.map(([k,v])=>`  · ${k} ${f(v)}${k==="회비"?` (${pc}명)`:""}`),"",
    `■ 지출 ${f(tout)}`,...(out.length?out.map(([k,v])=>`  · ${k} ${f(v)}`):["  · 없음"]),
    ...(uni?["",`■ 유니폼 (걷은 돈과 낸 돈 차이) ${uni>0?"+":"−"}${f(Math.abs(uni))}`]:[]),"",
    `■ ${m===cur?"현재":"월말"} 잔액 ${f(run)}`,"",
    `■ ${L} 회비 미납 ${unpaid.length}명${unpaid.length?": "+unpaid.join(", "):""}`,
    ...(adj.length?[`■ 불참 조정(${f(c.adjustAmt)}): ${adj.join(", ")}`]:[]),
    ...(guesses?["",`※ 메모 없는 거래 ${guesses}건은 추정해서 분류했어요. 틀린 게 있으면 총무에게 알려주세요.`]:[])];
  const text=lines.join("\n");
  $("#view").innerHTML=`
  <div class="card"><h2>단톡방에 올릴 월말 회계 보고</h2>
    <p class="note" style="margin-top:-4px">회칙 제11조: 총무는 매월 마지막 주에 수입과 지출을 단체 채팅방에 공개해요. 아래 글을 복사해서 그대로 올리면 돼요.</p>
    <div class="toolbar"><label class="f" for="rm">월<select id="rm">${[...ms].reverse().map(k=>`<option value="${k}" ${k===m?"selected":""}>${mLabel(k)}</option>`).join("")}</select></label>
      <button class="primary" id="copyRep" type="button">복사하기</button><span class="note" id="copyMsg"></span></div>
    <textarea id="repText" readonly style="width:100%;min-height:360px;font:inherit;font-size:13px;line-height:1.6;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">${esc(text)}</textarea>
    ${guesses?`<p class="note">이 달에 추정 분류가 ${guesses}건 있어요. 올리기 전에 <a href="#ledger">거래내역</a>에서 확인하면 더 정확해요.</p>`:""}</div>`;
  $("#rm").onchange=e=>{state.repMonth=e.target.value;render()};
  $("#copyRep").onclick=async()=>{ try{ await navigator.clipboard.writeText(text); $("#copyMsg").textContent="복사했어요."; }catch(_){ const t=$("#repText"); t.focus(); t.select(); $("#copyMsg").textContent="글이 선택됐어요. Ctrl+C(⌘C)로 복사해주세요."; } };
}

function forecast(rs){
  const c=cfg(); const I=fcInputs(rs); const dis=!editable()?"disabled":""; const cur=ym(today());
  const res={}; for(const k in SCEN){ res[k]=project(rs,I,SCEN[k]); res[k].st=scenStats(res[k],I.reserve); }
  const B=res.base, st=B.st; const full=B.filter(o=>!o.partial);
  const WK={}; for(const k in SCEN) WK[k]=projectWeeks(rs,I,SCEN[k]); const W=WK.base;
  for(const k in SCEN){ res[k].st.wmin=WK[k].reduce((a,o)=>o.bal<a.bal?o:a,WK[k][0]); }
  if(editable()) snapshotForecast(rs,B);
  const avgNet=Math.round(full.reduce((s,o)=>s+o.net,0)/full.length);
  const opexAvg=Math.round(full.reduce((s,o)=>s+o.field+o.other+o.plan,0)/full.length);
  const payersAvg=Math.round(I.members*I.rate/100);
  const breakeven=payersAvg?Math.ceil(opexAvg/payersAvg/1000)*1000:0;
  const rateBE=I.members&&c.dues?Math.ceil(opexAvg/(I.members*c.dues)*100):0;

/* ---------- 단독 실행용 저장소 (Claude 없이) ---------- */
let STANDALONE=false;
function localDB(){
  const DEMO=!!window.__DEMO; const KEY=DEMO?"hhfc-demo-v1":"hhfc-ledger-v1"; let data={};
  try{ data=DEMO?null:JSON.parse(localStorage.getItem(KEY)||"null")||null; }catch(_){ data=null; }
  const seed=window.__SEED; const localAt=data&&data["meta/info"]?.at||"";
  if(seed&&(!data||(seed.at||"")>localAt)){ // 파일에 든 데이터가 더 최신이면 그걸로 시작해요
    data={"meta/info":{at:seed.at||""}}; data["config/main"]=seed.cfg; for(const t of seed.tx){ const o=Object.assign({},t); const id=o.id; delete o.id; data["tx/"+id]=o; } }
  if(!data) data={"meta/info":{at:""}};
  const subs=new Set(); const emit=()=>subs.forEach(f=>{try{f()}catch(_){}});
  const persist=(touch=true)=>{ if(DEMO){ emit(); return; } if(touch) data["meta/info"]={at:new Date().toISOString()}; try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){ say("이 브라우저에 저장하지 못했어요. 백업 파일을 꼭 저장해 두세요.","bad",0); } emit(); };
  const clone=v=>JSON.parse(JSON.stringify(v));
  const snap=(id,d)=>({id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}});
  const docRef=path=>({ id:path.split("/").pop(), path,
    get:async()=>snap(path.split("/").pop(),data[path]),
    set:async v=>{ data[path]=clone(v); persist(); },
    update:async v=>{ if(!data[path]) throw {code:"invalid_argument"}; data[path]=Object.assign({},data[path],clone(v)); persist(); },
    delete:async()=>{ delete data[path]; persist(); },
    onSnapshot(cb){ const f=()=>cb(snap(path.split("/").pop(),data[path])); subs.add(f); setTimeout(f,0); return()=>subs.delete(f); } });
  persist(false);
  return { doc:docRef,
    collection:col=>({ doc:id=>docRef(col+"/"+id),
      onSnapshot(cb){ const f=()=>{ const docs=Object.keys(data).filter(k=>k.split("/").length===2&&k.startsWith(col+"/")).map(k=>snap(k.split("/")[1],data[k])); cb({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}}); }; subs.add(f); setTimeout(f,0); return()=>subs.delete(f); } }),
    exportAll:()=>clone(data), importAll:o=>{ data=clone(o); persist(); }, localAt:()=>data["meta/info"]?.at||"" };
}
function fileDownloads(){ return { save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".html")?"text/html":filename.endsWith(".json")?"application/json":"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); return {status:"saved"}; } }; }

  root.removeAttribute("data-theme"); root.setAttribute("lang","ko"); root.querySelector("body")?.classList.remove("locked");
  root.querySelector("#msg").innerHTML=""; if(title) root.querySelector("title").textContent=title;
  const demo=seedJs.includes("__DEMO"), BASE="https://seanbae-analyst.github.io/hanahae-fc/";
  const og={"og:title":demo?"HANA HAE FC · Club Finance Dashboard":"하나해 FC 회비 장부",
    "og:description":demo?"Auto-reconciled bank ledger, dues tracking and weekly cash-flow forecast for a weekend football club. Live demo, names anonymized.":"회비 납부 현황, 지출 내역, 주간 현금흐름 예측을 한눈에 보는 하나해 FC 장부",
    "og:url":BASE+(demo?"demo.html":"")};
  Object.entries(og).forEach(([k,v])=>{const e=root.querySelector(`meta[property="${k}"]`); if(e) e.setAttribute("content",v);});
  return "<!DOCTYPE html>\n"+root.outerHTML.replace("<script>\n\"use strict\";",`<script id="seed">${seedJs}<\/script>\n<script>\n"use strict";`);
}
const J=o=>JSON.stringify(o).replace(/</g,"\\u003c");
function buildSnapshot(){ // 파일 하나: 최신 데이터가 들어 있고, 팀원은 보기만, 관리자는 비밀번호로 이어서 관리
  const tx=[...state.tx.values()].map(t=>Object.assign({},t));
  const c=Object.assign({},cfg()); delete c.viewHash;
  return pageWithSeed(`window.__SEED=${J({at:new Date().toISOString(),cfg:c,tx})};`,"하나해 FC 회비 장부");
}
function buildDemo(){ // 링크드인용: 이름만 가리고 나머지는 실제와 똑같이, 영어로
  const c=cfg(); const members=c.members.map(m=>m.name); const pm={};
  members.forEach((n,i)=>pm[n]="Player "+String(i+1).padStart(2,"0"));
  let k=members.length; const person=n=>pm[n]||(pm[n]="Player "+String(++k).padStart(2,"0"));
  const catEN=x=>DICT[x]||"Other";
  const memoEN={"물값":"Water","전술판":"Tactics board","바람 넣는 기계 삼":"Ball pump","키퍼 용병 커피값":"Coffee for guest keeper"};
  const typeEN={"입금":"Deposit","모임원송금":"Transfer","출금":"Withdrawal","체크카드결제":"Card","이자입금":"Interest","프로모션입금":"Promo","직접 입력":"Manual"};
  const tx=[...rows()].reverse().map(r=>{ const o={id:r.id,t:r.t,amt:r.amt,src:r.src,cat:r._cat,type:typeEN[r.type]||"Other"}; if(r.bal!=null) o.bal=r.bal;
    const b=baseName(r.name); o.name=members.includes(b)?pm[b]+(r.name!==b?" (club acct)":""):isPersonName(b)?person(b):catEN(r._cat);
    if(r.payer) o.payer=person(r.payer); if(r.month) o.month=r.month;
    if(r.memo){ const g=r.memo.match(/(\d+\/\d+)\s*구장비/); const m=memoEN[r.memo]||(g?"Pitch fee "+g[1]:(/[가-힣]/.test(r.memo)?"":r.memo)); if(m) o.memo=m; }
    return o; });
  const d=Object.assign({},c); delete d.pinHash; delete d.viewHash; delete d.lastImport;
  d.members=c.members.map(m=>Object.assign({},m,{name:pm[m.name]}));
  d.adjust=Object.fromEntries(Object.entries(c.adjust||{}).map(([key,v])=>{const [n,mo]=key.split("|"); return [(pm[n]||person(n))+"|"+mo,v];}));
  d.planned=(c.planned||[]).map(p=>Object.assign({},p,{label:/[가-힣]/.test(p.label)?"Planned cost":p.label}));
  return pageWithSeed(`window.__DEMO=true;window.__LANG_DEFAULT="en";window.__SEED=${J({at:new Date().toISOString(),cfg:d,tx})};`,"HANA HAE FC · Dues Ledger (Demo)");
}
async function shareFile(){
  const d=today(); const name=`하나해FC_장부_${d.getMonth()+1}월${d.getDate()}일.html`; const html=buildSnapshot();
  if(downloads){ try{ await downloads.save({filename:name,data:html}); say("최신 장부 파일을 저장했어요. 이 파일을 단톡방에 올리면 팀원은 보기만 되고, 관리자는 이 파일을 열어서 비밀번호로 이어서 관리하면 돼요.","info",9000); return; }catch(e){ if(e&&e.code!=="declined") say("파일을 저장하지 못했어요. 잠시 뒤 다시 해주세요.","warn"); return; } }
  say("이 화면에서는 파일 저장이 안 돼요.","warn");

/* ---------- 버전 표시: 팀원에게 보이는 반영본 시각, 관리자에게는 반영 안 된 변경 ---------- */
function fmtAt(iso){ if(!iso) return ""; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function versionLabel(){ if(window.__DEMO) return EN?"Demo · member names anonymized":"데모 · 이름 가림"; const seedAt=window.__SEED?.at||""; const local=db?.localAt?.()||"";
  const pending=editable()&&local&&local>seedAt;
  return `${seedAt?fmtAt(seedAt)+" 반영본":"반영본 없음"}${pending?' · <span style="color:#F0A585">반영 안 된 변경 있음</span>':""}`; }
/* ---------- 링크(GitHub Pages)에 바로 반영 ---------- */
const ON_GH=/\.github\.io$/.test(location.hostname);
const GH={owner:ON_GH?location.hostname.split(".")[0]:"seanbae-analyst",repo:ON_GH?(location.pathname.split("/")[1]||"hanahae-fc"):"hanahae-fc",path:"index.html"};
const ghToken=()=>{try{return localStorage.getItem("hhfc-gh-token")||""}catch(_){return ""}};
async function ghPut(path,html,token,msg){
  const api=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;
  const h={Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"};
  const bytes=new TextEncoder().encode(html); let bin=""; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  let sha; const r0=await fetch(api+"?t="+Date.now(),{headers:h}); if(r0.ok) sha=(await r0.json()).sha; else if(r0.status===401) throw new Error("토큰이 맞지 않거나 만료됐어요. 설정 탭에서 새 토큰을 넣어주세요.");
  const r=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify({message:msg,content:btoa(bin),sha})});
  if(!r.ok){ const t=await r.json().catch(()=>({})); throw new Error(r.status===401||r.status===403?"토큰 권한이 부족해요. 이 저장소의 Contents 읽기·쓰기 권한이 있는 토큰인지 확인해주세요.":(t.message||("오류 "+r.status))); }
}
async function ghPublish(btn){
  const token=ghToken(); if(!token){ say("처음 한 번만, 설정 탭에서 GitHub 토큰을 넣어주세요.","warn",8000); location.hash="settings"; return; }
  if(btn) btn.disabled=true; say("링크에 반영하는 중…","info",0);
  try{
    const d=today(); const tag=`${d.getMonth()+1}/${d.getDate()}`;
    await ghPut("index.html",buildSnapshot(),token,`장부 업데이트 ${tag}`);
    let demoOk=true; try{ await ghPut("demo.html",buildDemo(),token,`데모 업데이트 ${tag}`); }catch(_){ demoOk=false; }
    if(window.__SEED) window.__SEED.at=new Date().toISOString(); else window.__SEED={at:new Date().toISOString()};
    render(); say(`링크에 반영했어요.${demoOk?" 영문 데모(이름 가림)도 같이 업데이트했어요.":" 데모는 업데이트하지 못했어요. 다시 눌러주세요."} 보통 1~2분, 늦으면 10분 안에 바뀌어요.`,"info",12000);
  }catch(e){ say("반영하지 못했어요. "+esc(e.message||e),"bad",0); }
  finally{ if(btn) btn.disabled=false; }
}

async function exportCsv(){
  const rs=rows(); const q=v=>{const s=String(v??"");return /^[=+\-@]/.test(s)&&isNaN(Number(s))?"'"+s:s};
  const lines=[["일시","적요","거래유형","금액","잔액","메모","분류","회비 월","낸 사람"].join(",")];
  for(const r of [...rs].reverse()) lines.push([r.t.replace("T"," "),q(r.name),q(r.type),r.amt,r.bal??"",q(r.memo),r._cat,r._cat==="회비"?dueMonth(r):"",r._cat==="회비"?payer(r):""].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  try{ await downloads.save({filename:`하나해FC_장부_${ym(today())}.csv`,data:"﻿"+lines.join("\n")}); }catch(e){ say("내보내기를 취소했거나 하지 못했어요.","warn"); }
}

window.addEventListener("hashchange",render);
(function swipe(){ let x0=null,y0=null,t0=0,skip=false;
  const view=document.getElementById("view");
  view.addEventListener("touchstart",e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now();
    skip=!!e.target.closest("canvas,input,select,textarea,.dues") || [...document.querySelectorAll(".scroll")].some(el=>el.contains(e.target)&&el.scrollWidth>el.clientWidth+4); },{passive:true});
  view.addEventListener("touchend",e=>{ if(x0==null||skip){x0=null;return} const t=e.changedTouches[0]; const dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-t0>700) return;
    if(document.body.classList.contains("locked")) return; const T=editable()?TABS:TABS.filter(t=>t!=="settings"); const i=T.indexOf(setTab()); const j=dx<0?Math.min(T.length-1,i+1):Math.max(0,i-1); if(j!==i&&i>=0) location.hash=T[j]; },{passive:true});
})();

$("#adminBtn").addEventListener("click",()=>{ if(editable()&&cfg().pinHash){ setAdminKey(null); render(); return; } $("#pinErr").textContent=""; $("#pinInput").value=""; const d=$("#pinDlg"); if(d.showModal) d.showModal(); else d.setAttribute("open",""); setTimeout(()=>$("#pinInput").focus(),50); });

(async()=>{
  setTab();
  if(SNAP){ state.cfg=SNAP.cfg; state.tx=new Map(SNAP.tx.map(d=>[d.id,d])); state.cfgLoaded=state.txLoaded=true; canWrite=false;
    render(); const a=$("#asof"); if(a){ const d=new Date(SNAP.at); a.textContent=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")} 기준 · 보기 전용`; } return; }
  const timer=setTimeout(()=>{ if(!state.txLoaded) say("장부를 아직 불러오지 못했어요. 인터넷 연결을 확인해주세요.","warn",0); },10000);
  if(!window.claude||typeof window.claude.use!=="function"){
    // 단독 실행: Claude 없이 이 파일만으로 돌아가요. 데이터는 이 브라우저에 저장돼요.
    STANDALONE=true; db=localDB(); canWrite=!window.__DEMO; downloads=fileDownloads();
  } else {
    db=await claude.use("db");
    if(!db){ clearTimeout(timer); $("#view").innerHTML=`<div class="card empty">장부를 보려면 claude.ai에 로그인해야 해요.</div>`; return; }
    claude.use("user").then(async u=>{ if(!u)return; try{ const v=await u.can("data.write"); if(v===false){canWrite=false;render()} else if(v===true){canWrite=true;render()} }catch(_){} });
    claude.use("downloads").then(d=>{downloads=d;render()}).catch(()=>{});
  }
  db.doc("config/main").onSnapshot(s=>{ state.cfg=s.exists?s.data():null; state.cfgLoaded=true; render(); },e=>{state.cfgLoaded=true;render()});
  db.collection("tx").onSnapshot(s=>{ state.tx=new Map(s.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())])); if(!s.metadata.fromCache){state.txLoaded=true;clearTimeout(timer);$("#msg").innerHTML=$("#msg").innerHTML.includes("불러오지 못했")?"":$("#msg").innerHTML} else if(s.size) state.txLoaded=true; render(); },
    e=>{ clearTimeout(timer); state.txLoaded=true; say("장부를 불러오지 못했어요. ("+esc(e.code)+")","bad",0); render(); });
})();
